<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- ================= CONTENT SECURITY POLICY ================= -->
    <!-- 
      UPDATED FOR GOOGLE MAPS SUPPORT:
      Added all required Google domains for maps to work properly
    -->
    <meta 
      http-equiv="Content-Security-Policy" 
      content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' https://maps.google.com https://maps.googleapis.com https://*.google.com https://*.googleapis.com https://*.gstatic.com;
        style-src 'self' 'unsafe-inline' https://maps.googleapis.com https://fonts.googleapis.com https://*.google.com https://*.googleapis.com https://*.gstatic.com;
        img-src 'self' data: blob: https: https://maps.google.com https://maps.gstatic.com https://*.google.com https://*.googleapis.com https://*.gstatic.com https://*.ggpht.com https://streetviewpixels-pa.googleapis.com;
        font-src 'self' data: https://fonts.gstatic.com https://*.gstatic.com;
        frame-src 'self' https://www.google.com https://maps.google.com https://maps.googleapis.com https://*.google.com https://*.googleapis.com;
        connect-src 'self' https://maps.google.com https://maps.googleapis.com https://*.google.com https://*.googleapis.com https://*.gstatic.com;
        object-src 'none';
        base-uri 'self';
        form-action 'self';
        frame-ancestors 'none';
      "
    />
    
    <!-- Additional security headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    
    <title>Estate Agent Property Search</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
